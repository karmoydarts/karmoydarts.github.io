<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sammenlagtranking, kveldsresultater, 180ere, raske legg og hoye utganger for Karmoy Darts Club, sesong 2026.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Karmøy Darts Club">
<meta property="og:title" content="Karmøy Darts Club – ranking 2026">
<meta property="og:description" content="Sammenlagtstillingen, kveld for kveld, 180ere, raske legg og høye utganger. Oppdateres etter hver klubbkveld.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23141310'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23e3dcc6' stroke-width='9'/%3E%3Ccircle cx='50' cy='50' r='17' fill='%23146b46'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23a82f24'/%3E%3C/svg%3E">
<title>Karmøy Darts Ranking</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

/* ---------- tokens: light (bare :root = complete palette) ---------- */
:root{
  --ground:#e9e9e3;
  --surface:#f6f6f2;
  --raised:#fffffc;
  --line:#d6d6cd;
  --line-soft:#e2e2d9;
  --text:#1b1916;
  --text-2:#4b4740;
  --muted:#7b766c;
  --faint:#a39d92;

  --bull:#a82f24;          /* dartboard double-red — brand accent */
  --bull-ink:#8e2a20;
  --bull-wash:#f5e3e0;
  --wire:#146b46;          /* dartboard green */
  --wire-ink:#0f5a3a;
  --wire-wash:#dfeee6;
  --brass:#8f6c11;         /* wire brass — first place only */
  --brass-wash:#f3ead1;

  --board-black:#1b1916;
  --board-cream:#e3dcc6;

  --shadow:0 1px 2px rgba(27,25,22,.06), 0 8px 24px -14px rgba(27,25,22,.22);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121110;
    --surface:#1a1917;
    --raised:#211f1c;
    --line:#302d29;
    --line-soft:#26241f;
    --text:#ece8df;
    --text-2:#c3bdb1;
    --muted:#8d8779;
    --faint:#6a6459;

    --bull:#d1483a;
    --bull-ink:#e26354;
    --bull-wash:#2a1613;
    --wire:#38a473;
    --wire-ink:#4cbb88;
    --wire-wash:#0f2419;
    --brass:#d6ac41;
    --brass-wash:#2b2214;

    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#121110;
  --surface:#1a1917;
  --raised:#211f1c;
  --line:#302d29;
  --line-soft:#26241f;
  --text:#ece8df;
  --text-2:#c3bdb1;
  --muted:#8d8779;
  --faint:#6a6459;
  --bull:#d1483a;
  --bull-ink:#e26354;
  --bull-wash:#2a1613;
  --wire:#38a473;
  --wire-ink:#4cbb88;
  --wire-wash:#0f2419;
  --brass:#d6ac41;
  --brass-wash:#2b2214;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}

h1,h2,h3,.disp{font-family:'Barlow Condensed','Archivo Narrow',system-ui,sans-serif;font-weight:600;margin:0;text-wrap:balance}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:16px;padding-bottom:18px;border-bottom:2px solid var(--text);flex-wrap:wrap}
#mark{width:52px;height:52px;flex:0 0 auto;display:block}
.top-id{flex:1 1 260px;min-width:0}
.top-id h1{font-size:32px;line-height:.95;letter-spacing:-.005em;text-transform:uppercase}
.top-id h1 em{font-style:normal;color:var(--bull)}
.top-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.theme-btn{margin-left:auto;flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:99px;padding:6px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.theme-btn:hover{color:var(--text);border-color:var(--text-2)}

.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:2px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.tag.hot{background:var(--bull-wash);border-color:transparent;color:var(--bull-ink)}

/* ---------- nav ---------- */
nav{display:flex;gap:2px;margin:0 0 22px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;
  font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap
}
nav button:hover{color:var(--text)}
nav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--bull)}
nav button:focus-visible,.theme-btn:focus-visible,.rowbtn:focus-visible,input:focus-visible,.chipbtn:focus-visible{
  outline:2px solid var(--bull);outline-offset:2px}

/* ---------- stat strip ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.strip>div{background:var(--surface);padding:12px 14px;min-width:0}
.strip .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.strip .v{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:600;line-height:1.05;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .champ{background:var(--brass-wash)}
.strip .champ .v{color:var(--brass)}
.strip .champ .k{color:var(--brass)}

/* ---------- generic blocks ---------- */
.block{margin-bottom:26px}
.block>h2{font-size:20px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:baseline;gap:10px}
.block>h2 span{font-family:'Archivo',sans-serif;font-size:12px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-pad{padding:16px}

input.q{width:100%;max-width:340px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--raised);color:var(--text);font:inherit;font-size:14px;margin-bottom:12px}
input.q::placeholder{color:var(--faint)}

/* ---------- leaderboard ---------- */
.board{display:flex;flex-direction:column}
.rowbtn{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--line-soft);border-radius:0;padding:11px 6px;
  font:inherit;color:var(--text);cursor:pointer}
.rowbtn:hover{background:var(--surface)}
.rowbtn.podium{background:var(--raised);box-shadow:var(--shadow);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 13px;margin-bottom:6px}
.rowbtn.p4{margin-top:8px}
.rowbtn.p1{border-left:3px solid var(--brass)}
.rowbtn.p2{border-left:3px solid var(--faint)}
.rowbtn.p3{border-left:3px solid var(--bull)}
.pos{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--faint);text-align:center;line-height:1}
.p1 .pos{color:var(--brass)}.p2 .pos{color:var(--text-2)}.p3 .pos{color:var(--bull)}
.who{min-width:0}
.nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.podium .nm{font-size:17px}
.sub{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px}
.mini{font-size:11px;color:var(--muted);font-weight:500}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;letter-spacing:.02em}
.b180{background:var(--bull-wash);color:var(--bull-ink)}
.brl{background:var(--wire-wash);color:var(--wire-ink)}
.but{background:var(--brass-wash);color:var(--brass)}
.score{text-align:right}
.score .pts{display:block;font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.score .lbl{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.form{display:flex;gap:3px;justify-content:flex-end;margin-top:5px}
.fpip{width:20px;height:16px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
  display:flex;align-items:center;justify-content:center;background:var(--line-soft);color:var(--muted);border:1px solid var(--line)}
.fpip.w{background:var(--brass-wash);color:var(--brass);border-color:transparent}
.fpip.t{background:var(--wire-wash);color:var(--wire-ink);border-color:transparent}

/* expanded detail */
.detail{border:1px solid var(--line);border-radius:var(--radius);
  background:var(--raised);padding:14px;margin:2px 0 22px;display:grid;gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.dcol h4{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);margin:0 0 7px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px dotted var(--line)}
.kv:last-child{border-bottom:none}
.kv b{font-family:'IBM Plex Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:2px 7px;border-radius:4px;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2)}
.chip.hi{background:var(--bull-wash);border-color:transparent;color:var(--bull-ink);font-weight:500}
.empty{font-size:13px;color:var(--faint)}

/* ---------- sesongvelger ---------- */
.seasons{display:flex;gap:4px;align-items:center}
.seasons button{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.04em;
  padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seasons button:hover{color:var(--text);border-color:var(--text-2)}
.seasons button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--ground)}
.seasons button:focus-visible{outline:2px solid var(--bull);outline-offset:2px}

/* ---------- plassering, medalje og bevegelse ---------- */
.posw{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.medal{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;line-height:1;border:2px solid}
.p1 .medal{background:var(--brass-wash);border-color:var(--brass);color:var(--brass)}
.p2 .medal{background:var(--line-soft);border-color:var(--faint);color:var(--text-2)}
.p3 .medal{background:var(--bull-wash);border-color:var(--bull);color:var(--bull-ink)}
.mv{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;font-weight:600;line-height:1;white-space:nowrap}
.mv.up{color:var(--wire-ink)}
.mv.down{color:var(--bull-ink)}
.mv.same{color:var(--faint)}
.mv.new{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- spillerlenke ---------- */
.plink{display:inline;background:none;border:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;
  border-bottom:1px dotted var(--faint);max-width:100%}
.plink:hover{color:var(--bull);border-bottom-color:var(--bull)}
.plink:focus-visible{outline:2px solid var(--bull);outline-offset:2px}

/* ---------- spillerprofil ---------- */
.back{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;
  padding:6px 14px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:16px}
.back:hover{color:var(--text);border-color:var(--text-2)}
.back:focus-visible{outline:2px solid var(--bull);outline-offset:2px}
.phead{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:18px;
  padding-bottom:15px;border-bottom:2px solid var(--text)}
.pring{width:58px;height:58px;border-radius:50%;flex:0 0 auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;border:2px solid var(--line);background:var(--surface)}
.pring b{font-family:'Barlow Condensed',sans-serif;font-size:26px;line-height:.85;font-weight:700}
.pring i{font-style:normal;font-size:8px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.pring.g1{border-color:var(--brass);background:var(--brass-wash)}
.pring.g1 b{color:var(--brass)}
.pring.g2{border-color:var(--faint)}
.pring.g3{border-color:var(--bull);background:var(--bull-wash)}
.pring.g3 b{color:var(--bull-ink)}
.pid{flex:1 1 200px;min-width:0}
.pid h2{font-size:29px;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.psub{font-size:13px;color:var(--muted);margin-top:4px}
.sparkbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.spark{width:100%;height:auto;display:block;margin:6px 0 2px;overflow:visible}
.sparklab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
  font-family:'IBM Plex Mono',ui-monospace,monospace}
.finrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;padding:7px 0;
  border-bottom:1px dotted var(--line);font-size:14px}
.finrow:last-child{border-bottom:none}
.finrow .fw{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.finrow .fw.won{background:var(--brass-wash);color:var(--brass)}
.finrow .fw.lost{background:var(--line-soft);color:var(--muted)}

/* ---------- bar list ---------- */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(88px,178px) 1fr 46px;gap:10px;align-items:center;font-size:13px}
.bar .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.bar .track{height:12px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;border-radius:3px;background:var(--bull)}
.bar .fill.g{background:var(--wire)}
.bar .bv{font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- tables ---------- */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
th.r,td.r{text-align:right}
td.name{font-weight:500;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
td.mono,th.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.hm{text-align:center;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.hm.z{color:var(--faint)}

/* ---------- nights ---------- */
.nights{display:flex;flex-direction:column;gap:10px}
.night{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.night>header{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.night h3{font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.night header .m{font-size:12px;color:var(--muted);margin-left:auto}
.res{display:flex;flex-direction:column}
.res-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:7px 14px;font-size:14px}
.res-row+.res-row{border-top:1px solid var(--line-soft)}
.res-row .rp{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);text-align:right}
.res-row.win .rp{color:var(--brass);font-weight:500}
.res-row .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-row.win .rn{font-weight:600}
.res-row .rr{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.gain{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;padding:1px 6px;border-radius:4px;
  background:var(--line-soft);color:var(--text-2)}
.gain.g15{background:var(--brass-wash);color:var(--brass)}
.gain.g12{background:var(--bull-wash);color:var(--bull-ink)}
.gain.g9{background:var(--wire-wash);color:var(--wire-ink)}

/* ---------- ladder ---------- */
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.rung{background:var(--surface);padding:12px 14px}
.rung .pl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rung .pv{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1.05}
.rung.a .pv{color:var(--brass)}.rung.b .pv{color:var(--bull)}.rung.c .pv{color:var(--wire)}

/* ---------- form ---------- */
.delta{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.delta.up{color:var(--wire-ink)}
.delta.down{color:var(--bull-ink)}
.delta.same{color:var(--faint)}

/* ---------- rekorder ---------- */
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;
  display:flex;flex-direction:column;gap:2px}
.rec.star{background:var(--brass-wash);border-color:var(--brass)}
.rec .rl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;
  min-height:2.4em;line-height:1.2}
.rec .rv{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1;margin:3px 0 1px}
.rec.star .rv{color:var(--brass)}
.rec .rn{font-size:14px;font-weight:600}
.rec .rc{font-size:12px;color:var(--muted)}

/* ---------- turneringer ---------- */
.trns{display:flex;flex-direction:column;gap:16px}
.trn{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.trn>header{display:flex;align-items:baseline;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trn h3{font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.trn>header .m{font-size:12px;color:var(--muted);margin-left:auto}
.tnote{font-size:12px;color:var(--muted);padding:10px 15px 0;line-height:1.5}
.tplaces{display:flex;flex-direction:column;padding:12px 15px 15px}
.tp{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--line)}
.tp:last-child{border-bottom:none}
.tp .pl{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap}
.tp .nm2{font-size:14px;line-height:1.45}
.tp.g1{background:var(--brass-wash);border-radius:7px;padding:10px 12px;margin:0 -12px 4px;border-bottom:none}
.tp.g1 .pl{color:var(--brass);font-weight:700}
.tp.g1 .nm2{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;color:var(--brass);line-height:1.1}
.tp.g2 .nm2,.tp.g3 .nm2{font-weight:600}
.thead{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;
  padding:12px 0 4px;border-top:1px solid var(--line);margin-top:8px}

footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

@media (max-width:640px){
  .wrap{padding:20px 14px 48px}
  .top-id h1{font-size:26px}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}

   Nøkkelen er sesongen, slik at arkiverte sesonger beholder sin egen mester. */
const CHAMPS={2026:{navn:"Frank Cassidy",dato:"17. januar 2026"}};

  {t:"9. plass og lavere",v:3,c:""}
];
const points=pos=>pos===1?15:pos===2?12:pos<=4?9:pos<=8?6:3;

/* ---------- derived state ---------- */
const DARTS=[13,14,15,16,17,18,19,20,21];
const CO_BANDS=[
  {t:"101–120",lo:101,hi:120},
  {t:"121–140",lo:121,hi:140},

/* ---------- sesonger ----------
   Sesongen utledes av datoen på hver kveld. Når 2027 starter dukker den opp
   som en ny knapp i toppen, og 2026 blir liggende som arkiv med sine egne tall. */
const seasonOf=iso=>Number(String(iso).slice(0,4));
const SEASONS=[...new Set(NIGHTS.map(n=>seasonOf(n.date)))].sort((a,b)=>b-a);
let SEASON=SEASONS[0];

const NAME={};PLAYERS.forEach(b=>{NAME[b.id]=b.n;});

/* Ved lik poengsum avgjør snitt per kveld, deretter seire og 180ere. */
const CMP=(a,b)=>b.pts-a.pts||b.avg-a.avg||b.wins-a.wins||b.max-a.max||a.name.localeCompare(b.name,'nb');

/* Hvem sto i finalen? Navnet må stå i finalestrengen. Er navnet en del av et
   lengre navn som også står der, lukes det bort så vi ikke får falske treff. */
function finalists(str){
  if(!str) return [];
  const hit=PLAYERS.filter(b=>str.indexOf(b.n)>=0);
  return hit.filter(b=>!hit.some(o=>o.id!==b.id&&o.n!==b.n&&o.n.indexOf(b.n)>=0)).map(b=>b.id);
}

/* Bygger spillertall fra en liste kvelder. Kalles både for hele sesongen og
   for sesongen fram til og med hver enkelt kveld (til plasseringskurven). */
function tally(nights){
  const m={};
  nights.forEach(night=>{
    const fin=finalists(night.final);
    night.res.forEach(r=>{
      if(!NAME[r.id]) return;
      const p=m[r.id]||(m[r.id]={id:r.id,name:NAME[r.id],pts:0,att:0,wins:0,max:0,
        raske:[0,0,0,0,0,0,0,0,0],co:[],nights:[],finals:[]});
      const g=points(r.pos);
      p.pts+=g; p.att++; if(r.pos===1)p.wins++;
      p.max+=r.m||0;
      if(r.r) r.r.forEach((v,i)=>p.raske[i]+=v);
      if(r.co) r.co.forEach(v=>p.co.push(v));
      p.nights.push({week:night.week,date:night.date,pos:r.pos,gain:g,field:night.res.length,
        max:r.m||0,co:r.co||[],rl:(r.r||[]).reduce((a,v)=>a+v,0)});
      if(fin.indexOf(r.id)>=0) p.finals.push({week:night.week,text:night.final,won:r.pos===1});
    });
  });
  const all=Object.values(m);
  all.forEach(p=>{
    p.rl=p.raske.reduce((a,v)=>a+v,0);
    p.co.sort((a,b)=>b-a);
    p.best=p.co.length?p.co[0]:0;
    p.avg=p.att?p.pts/p.att:0;
    const i=p.raske.findIndex(v=>v>0);
    p.bestLeg=i<0?null:DARTS[i];
    p.bestPos=p.nights.length?p.nights.reduce((a,n)=>Math.min(a,n.pos),99):null;
  });
  return all;
}

/* ---------- avledet tilstand for valgt sesong ---------- */
let P,ALL,RANKED,T,SN,STR,CHAMP,HIST;
function rebuild(){
  SN=NIGHTS.filter(n=>seasonOf(n.date)===SEASON);
  STR=TOURNAMENTS.filter(t=>seasonOf(t.iso)===SEASON);
  ALL=tally(SN);
  P={}; ALL.forEach(p=>{P[p.id]=p;});
  RANKED=[...ALL].sort(CMP);
  RANKED.forEach((p,i)=>{p.rank=i+1;});

  /* plasseringen etter hver kveld – gir både kurven i profilen og pilene i rankingen */
  HIST=[];
  for(let i=1;i<=SN.length;i++){
    const r=tally(SN.slice(0,i)).sort(CMP);
    const m={}; r.forEach((p,j)=>{m[p.id]=j+1;});
    HIST.push({week:SN[i-1].week,date:SN[i-1].date,rank:m});
  }
  const prev=HIST.length>1?HIST[HIST.length-2].rank:null;
  ALL.forEach(p=>{
    p.prev=prev?(prev[p.id]||null):null;
    p.mv=p.prev==null?null:p.prev-p.rank;
  });

  CHAMP=CHAMPS[SEASON]||null;
  T={
    players:ALL.length,
    nights:SN.length,
    max:ALL.reduce((a,p)=>a+p.max,0),
    rl:ALL.reduce((a,p)=>a+p.rl,0),
    co:ALL.reduce((a,p)=>a+p.co.length,0),
    att:ALL.reduce((a,p)=>a+p.att,0)
  };
  T.bestCo=ALL.filter(p=>p.best).sort((a,b)=>b.best-a.best)[0]||null;
  T.leader=RANKED[0];
  T.archived=SEASON!==SEASONS[0];
}

/* ===================== SPILLERPROFIL =====================
   Alt vi vet om én spiller i valgt sesong: nøkkeltall, plasseringskurve,
   finaler, og hver kveld hen har spilt. */
function sparkRank(p){
  const pts=[];
  HIST.forEach((h,i)=>{ const r=h.rank[p.id]; if(r) pts.push({i:i,r:r,week:h.week}); });
  if(pts.length<2) return '';
  const W=600,H=150,padX=10,padT=14,padB=14;
  const lo=Math.max(1,pts.reduce((a,q)=>Math.min(a,q.r),99)-1);
  const hi=pts.reduce((a,q)=>Math.max(a,q.r),1)+1;
  const span=Math.max(1,hi-lo);
  const X=i=>padX+(HIST.length<2?0:(i/(HIST.length-1))*(W-2*padX));
  const Y=r=>padT+((r-lo)/span)*(H-padT-padB);
  const line=pts.map(q=>`${X(q.i).toFixed(1)},${Y(q.r).toFixed(1)}`).join(' ');
  const area=`${X(pts[0].i).toFixed(1)},${(H-padB).toFixed(1)} ${line} ${X(pts[pts.length-1].i).toFixed(1)},${(H-padB).toFixed(1)}`;
  const dots=pts.map(q=>
    `<circle cx="${X(q.i).toFixed(1)}" cy="${Y(q.r).toFixed(1)}" r="4" fill="var(--bull)"><title>${esc(q.week)}: ${q.r}. plass</title></circle>`).join('');
  const now=pts[pts.length-1].r, bestRank=pts.reduce((a,q)=>Math.min(a,q.r),99);
  return `<div class="block"><h2>Plassering gjennom sesongen <span>etter hver klubbkveld</span></h2>
    <div class="sparkbox">
      <div class="sparklab"><span>${lo===1?'1. plass':lo+'. plass'}</span><span>beste: ${bestRank}. · nå: ${now}.</span></div>
      <svg class="spark" viewBox="0 0 ${W} ${H}" role="img"
           aria-label="Plassering i rankingen etter hver kveld, fra ${pts[0].r}. til ${now}. plass">
        <polygon points="${area}" fill="var(--bull)" opacity=".08"/>
        <polyline points="${line}" fill="none" stroke="var(--bull)" stroke-width="2.5"
                  stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        ${dots}
      </svg>
      <div class="sparklab"><span>${hi}. plass</span><span>${esc(pts[0].week.split(' – ')[0])} → ${esc(pts[pts.length-1].week.split(' – ')[0])}</span></div>
    </div></div>`;
}

/* ----- 180 & raske legg ----- */
function vLegs(){
  const m=ALL.filter(p=>p.max).sort((a,b)=>b.max-a.max);
  const r=ALL.filter(p=>p.rl).sort((a,b)=>b.rl-a.rl);
  const fastest=ALL.filter(p=>p.bestLeg).sort((a,b)=>a.bestLeg-b.bestLeg)[0];
  const rows=[...r].sort((a,b)=>{
    const ai=a.raske.findIndex(v=>v>0),bi=b.raske.findIndex(v=>v>0);
    return ai-bi||b.rl-a.rl;
  });
  const colMax=DARTS.map((_,i)=>Math.max(...ALL.map(p=>p.raske[i])));
  return strip([
    {k:'180ere totalt',v:T.max,s:m.length?`${esc(first(m[0].name))} leder med ${m[0].max}`:''},
    {k:'Raske legg totalt',v:T.rl,s:r.length?`${esc(first(r[0].name))} leder med ${r[0].rl}`:''},
    {k:'Raskeste leg',v:fastest?fastest.bestLeg+' piler':'–',s:fastest?esc(fastest.name):''},
    {k:'Spillere med 180',v:m.length,s:`av ${T.players} i klubben`}
  ])+
  `<div class="block"><h2>Antall 180ere</h2>
    ${barList(m.map(p=>({n:p.name,v:p.max})),m.length?m[0].max:1)}</div>
  <div class="block"><h2>Raske legg <span>legg fullført på 21 piler eller mindre</span></h2>
    ${barList(r.slice(0,12).map(p=>({n:p.name,v:p.rl})),r.length?r[0].rl:1,'g')}</div>
  <div class="block"><h2>Pilforbruk <span>antall legg fullført på så mange piler</span></h2>
    <p class="hint">Sortert etter raskeste leg. Mørkere celle = flere legg på det pileantallet.</p>
    <div class="panel scroll"><table>
      <thead><tr><th>Spiller</th>${DARTS.map(d=>`<th class="r mono">${d}</th>`).join('')}<th class="r mono">Sum</th></tr></thead>
      <tbody>${rows.map(p=>`<tr><td class="name">${plink(p.id,p.name)}</td>
        ${p.raske.map((v,i)=>{
          const mx=colMax[i]||1;
          const a=v?(0.14+0.5*(v/mx)).toFixed(2):0;
          return `<td class="hm${v?'':' z'}" style="${v?`background:color-mix(in srgb, var(--wire) ${Math.round(a*100)}%, transparent)`:''}">${v||'·'}</td>`;
        }).join('')}
        <td class="r mono" style="font-weight:600">${p.rl}</td></tr>`).join('')}</tbody>
    </table></div></div>`;
}

/* ----- Utganger ----- */

/* ===================== FORMTABELL =====================
   Rangering basert kun på de siste kveldene, slik at den viser hvem som
   spiller godt nå — ikke hvem som har møtt opp flest ganger siden april. */
const FORM_N=5;
function vForm(){
  const last=SN.slice(-FORM_N);
  const st={};
  last.forEach((n,ni)=>n.res.forEach(r=>{
    const s=st[r.id]||(st[r.id]={id:r.id,pts:0,n:0,best:99,runs:[]});
    s.pts+=points(r.pos); s.n++; if(r.pos<s.best)s.best=r.pos;
    s.runs.push({week:n.week.split(' – ')[0],pos:r.pos});
  }));
  let rows=Object.values(st).map(x=>({...x,p:P[x.id]})).filter(x=>x.p);
  if(!rows.length) return `<p class="empty">Ingen kvelder i loggen ennå.</p>`;
  // sesongplassering blant de samme spillerne, så sammenligningen blir rettferdig
  const seasonOrder=[...rows].sort((a,b)=>b.p.pts-a.p.pts).map(x=>x.id);
  rows.sort((a,b)=> b.pts-a.pts || b.n-a.n || a.best-b.best || a.p.rank-b.p.rank);
  rows.forEach((r,i)=>{ r.fr=i+1; r.sr=seasonOrder.indexOf(r.id)+1; r.d=r.sr-r.fr; });
  const top=rows[0], mx=top.pts;
  const climber=[...rows].sort((a,b)=>b.d-a.d)[0];
  const full=rows.filter(r=>r.n===last.length).length;
  return strip([
    {k:`Formtopp`,v:esc(first(top.p.name)),s:`${top.pts} poeng på ${top.n} kveld${top.n===1?'':'er'}`},
    {k:'Kvelder i grunnlaget',v:last.length,s:esc(last[0].week.split(' – ')[0])+' – '+esc(last[last.length-1].week.split(' – ')[0])},
    {k:'Størst klatring',v:climber.d>0?'+'+climber.d:'–',s:climber.d>0?esc(climber.p.name):'ingen endring'},
    {k:'Med på alle',v:full,s:`av ${rows.length} spillere`}
  ])+
  `<div class="block"><h2>Form <span>siste ${last.length} kvelder</span></h2>
    <p class="hint">Bare poeng fra de siste ${last.length} kveldene teller. Pilen viser hvordan formplasseringen ligger an mot sesongplasseringen blant de samme spillerne — grønt betyr at spilleren gjør det bedre nå enn sesongen tilsier.</p>
    ${barList(rows.slice(0,12).map(r=>({n:r.p.name,v:r.pts})),mx,'g')}</div>
  <div class="block"><h2>Full formtabell</h2>
    <div class="panel scroll"><table>
      <thead><tr><th class="r mono">#</th><th>Spiller</th><th class="r mono">Poeng</th>
        <th class="r mono">Kvelder</th><th class="r mono">Snitt</th><th class="r mono">Beste</th>
        <th class="r mono">Sesong</th><th></th><th>Plasseringer</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td class="r mono" style="color:var(--muted)">${r.fr}</td>
        <td class="name">${plink(r.p.id,r.p.name)}</td>
        <td class="r mono" style="font-weight:600">${r.pts}</td>
        <td class="r mono">${r.n}/${last.length}</td>
        <td class="r mono">${one(r.pts/r.n)}</td>
        <td class="r mono">${r.best}.</td>
        <td class="r mono" style="color:var(--muted)">${r.sr}</td>
        <td class="r"><span class="delta ${r.d>0?'up':r.d<0?'down':'same'}">${r.d>0?'▲'+r.d:r.d<0?'▼'+(-r.d):'–'}</span></td>
        <td><span class="form" style="justify-content:flex-start">${r.runs.map(x=>
          `<span class="fpip ${x.pos===1?'w':x.pos<=4?'t':''}" title="${esc(x.week)}">${x.pos}</span>`).join('')}</span></td>
      </tr>`).join('')}</tbody></table></div></div>`;
}

/* ===================== REKORDER ===================== */
function vRec(){
  const recs=[];
  const add=(l,v,n,c,star)=>{ if(v!=null&&v!=='') recs.push({l,v,n,c,star}); };
  const best=(arr,f)=>arr.filter(x=>f(x)!=null).sort((a,b)=>f(b)-f(a))[0];

  // sesongtotaler
  const mCo=ALL.filter(p=>p.best).sort((a,b)=>b.best-a.best)[0];
  add('Høyeste utgang',mCo?mCo.best:null,mCo&&mCo.name,'høyeste registrerte finish',true);
  const fast=ALL.filter(p=>p.bestLeg).sort((a,b)=>a.bestLeg-b.bestLeg)[0];
  add('Raskeste leg',fast?fast.bestLeg+' piler':null,fast&&fast.name,'færrest piler på ett leg',true);
  const mM=best(ALL,p=>p.max);
  add('Flest 180ere',mM.max,mM.name,'i sesongen');
  const mR=best(ALL,p=>p.rl);
  add('Flest raske legg',mR.rl,mR.name,'21 piler eller mindre');
  const mW=best(ALL,p=>p.wins);
  add('Flest kveldsseire',mW.wins,mW.name,'i sesongen');
  const mA=best(ALL,p=>p.att);
  add('Flest oppmøter',mA.att,mA.name,`av ${SN.length} klubbkvelder`);
  const mC=best(ALL.filter(p=>p.co.length),p=>p.co.length);
  if(mC) add('Flest utganger over 100',mC.co.length,mC.name,'i sesongen');
  const qual=ALL.filter(p=>p.att>=MIN_ATT);
  const mAvg=qual.sort((a,b)=>b.avg-a.avg)[0];
  if(mAvg) add('Beste snitt per kveld',one(mAvg.avg),mAvg.name,`minst ${MIN_ATT} kvelder`);

  // kveldsrekorder fra loggen
  let n180={v:0},nRl={v:0},nCo={v:0};
  SN.forEach(n=>{
    const wk=n.week.split(' – ')[0];
    n.res.forEach(r=>{
      if((r.m||0)>n180.v) n180={v:r.m,k:r.id,wk};
      const rl=(r.r||[]).reduce((a,b)=>a+b,0);
      if(rl>nRl.v) nRl={v:rl,k:r.id,wk};
      if((r.co||[]).length>nCo.v) nCo={v:r.co.length,k:r.id,wk};
    });
  });
  if(n180.v) add('Flest 180ere på én kveld',n180.v,P[n180.k].name,n180.wk);
  if(nRl.v) add('Flest raske legg på én kveld',nRl.v,P[nRl.k].name,nRl.wk);
  if(nCo.v>1) add('Flest høye utganger på én kveld',nCo.v,P[nCo.k].name,nCo.wk);
  const bigN=[...SN].sort((a,b)=>b.res.length-a.res.length)[0];
  add('Størst oppmøte',bigN.res.length+' spillere',bigN.week.split(' – ')[0],'på én klubbkveld');

  // rekker
  const streak=(test)=>{
    let bestRun={v:0};
    Object.keys(P).forEach(id=>{
      let run=0;
      SN.forEach(n=>{
        const r=n.res.find(x=>x.id===Number(id));
        if(test(r)){ run++; if(run>bestRun.v) bestRun={v:run,k:Number(id)}; }
        else run=0;
      });
    });
    return bestRun;
  };
  const sWin=streak(r=>r&&r.pos===1);
  if(sWin.v>1) add('Lengste seiersrekke',sWin.v+' kvelder',P[sWin.k].name,'vunnet på rad');
  const sPod=streak(r=>r&&r.pos<=3);
  if(sPod.v>1) add('Lengste pallrekke',sPod.v+' kvelder',P[sPod.k].name,'topp 3 på rad');
  const sAtt=streak(r=>!!r);
  if(sAtt.v>1) add('Lengste oppmøterekke',sAtt.v+' kvelder',P[sAtt.k].name,'på rad i loggen');

  return `<div class="block"><h2>Rekorder <span>sesong ${SEASON}</span></h2>
    <p class="hint">Alle ${SN.length} klubbkveldene i sesongen ligger i loggen, så hver rekord kan knyttes til kvelden den ble satt. Klubbmesterskapet og sommerturneringen er egne arrangementer og teller ikke.</p>
    <div class="recs">${recs.map(r=>`
      <div class="rec${r.star?' star':''}">
        <div class="rl">${r.l}</div>
        <div class="rv">${r.v}</div>
        <div class="rn">${esc(r.n)}</div>
        <div class="rc">${esc(r.c)}</div>
      </div>`).join('')}</div></div>`;
}

function vTrn(){
  // «Frank C» og «Frank Cassidy» er samme mann – winner-feltet holder styr på det
  const wins={};
  STR.forEach(t=>{wins[t.winner]=(wins[t.winner]||0)+1;});
  if(!STR.length) return `<p class="empty">Ingen turneringer registrert i sesongen ${SEASON}.</p>`;
  const top=Object.entries(wins).sort((a,b)=>b[1]-a[1])[0];
  const deltakere=STR.reduce((a,t)=>a+t.n,0);
  const siste=STR[STR.length-1];
  return strip([
    {k:'Turneringer',v:STR.length,s:'utenom klubbrankingen'},
    {k:'Flest seire',v:top[1]+'×',s:esc(top[0]),c:'champ'},
    {k:'Deltakere totalt',v:deltakere,s:'inkludert gjestespillere'},
    {k:'Siste turnering',v:esc(siste.date.replace(' '+SEASON,'')),s:esc(siste.name)}
  ])+
  `<div class="block"><h2>Turneringer <span>gir ikke rankingpoeng</span></h2>
   <p class="hint">Mesterskap og åpne turneringer med spillere fra andre klubber holdes utenfor sammenlagtrankingen, slik at poengstigen bare måler klubbkveldene. Resultatlistene står her slik de ble lagt ut.</p>
   <div class="trns">${STR.map(t=>`
     <article class="trn">
       <header><h3>${esc(t.name)}</h3><span class="tag">${esc(t.date)}</span>
         <span class="m">${t.n} deltakere</span></header>
       ${t.note?`<p class="tnote">${esc(t.note)}</p>`:''}
       <div class="tplaces">${t.places.map((pl,i)=>
         `${pl.head?`<div class="thead">${esc(pl.head)}</div>`:''}
          <div class="tp${i===0&&!pl.head?' g1':i===1?' g2':i===2?' g3':''}">
            <span class="pl">${esc(pl.p)}</span>
            <span class="nm2">${pl.names.map(esc).join(', ')}${pl.sub?` <span class="mini">— ${esc(pl.sub)}</span>`:''}</span>
          </div>`).join('')}</div>
     </article>`).join('')}</div></div>`;
}

/* ---------- shell ---------- */
let current='rank', profileId=null;
const tabs=document.getElementById('tabs'), views=document.getElementById('views');
tabs.innerHTML=VIEWS.map(v=>
  `<button type="button" role="tab" data-v="${v.id}" aria-selected="${v.id===current}">${v.label}</button>`).join('');
function draw(){
  const onProfile=profileId!=null&&P[profileId];
  tabs.querySelectorAll('button').forEach(b=>
    b.setAttribute('aria-selected',!onProfile&&b.dataset.v===current));
  views.innerHTML=onProfile?vProfile(P[profileId]):VIEWS.find(v=>v.id===current).render();
}
function toTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

tabs.addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]'); if(!b) return;
  current=b.dataset.v; profileId=null; draw(); toTop();
});
views.addEventListener('click',e=>{
  if(e.target.closest('#back')){ profileId=null; draw(); toTop(); return; }
  const pb=e.target.closest('[data-player]'); if(!pb) return;
  const id=Number(pb.dataset.player);
  if(!P[id]) return;
  profileId=id; draw(); toTop();
});
views.addEventListener('input',e=>{
  if(e.target.id!=='q') return;
  query=e.target.value;
  document.getElementById('board').innerHTML=boardRows();
});

/* sesongbytte */
document.getElementById('topmeta').addEventListener('click',e=>{
  const b=e.target.closest('button[data-season]'); if(!b) return;
  const y=Number(b.dataset.season); if(y===SEASON) return;
  SEASON=y; profileId=null; query=''; rebuild(); drawMeta(); draw(); toTop();
});

/* theme toggle: explicit choice wins over the OS in both directions */
document.getElementById('themebtn').addEventListener('click',()=>{
  const root=document.documentElement;
  const dark=root.getAttribute('data-theme')==='dark' ||
    (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme',dark?'light':'dark');
  try{localStorage.setItem('kdc-theme',dark?'light':'dark');}catch(e){}
});
try{const t=localStorage.getItem('kdc-theme'); if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}

rebuild();
drawMeta();
draw();
</script>
